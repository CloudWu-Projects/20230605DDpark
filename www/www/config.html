<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Config setting</title>
<!--   
  <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.7/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.7/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap-table/1.24.1/bootstrap-table.min.js"></script>
  <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-table/1.24.1/bootstrap-table.min.css" rel="stylesheet">
   -->
  <link href="../www/bootstrap.min.css" rel="stylesheet">
  <script src="../www/jquery.min.js"></script>
<script src="../www/bootstrap.bundle.min.js"></script>
  <link href="../www/bootstrap-table.min.css" rel="stylesheet">
  
  <script src="../www/bootstrap-table.min.js"></script>

  <style>
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      border-radius: 0.25rem;
      border: 1px solid #ced4da;
      width: 80%;
      box-sizing: border-box;
    }

    .form-group .unit {
      margin-left: 0.5rem;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div  class="alert alert-success" style="position: fixed; bottom: 0; left: 0; z-index: 1050;">{{.Version}}</div>
  
  <div id="alertMessage" class="alert alert-success text-center" style=""></div>
  <div class="container mt-3">
    <h3>逸安启 -20250601111 </h3>
    {{if .Debug }}
    <div class="alert alert-danger">Debug Mode</div>
    {{end}}

    <button type="button" class="btn btn-primary" data-bs-heading="添加停车场" id="addpark_Btn">
      添加停车场
    </button>
    {{template "modalForm" .}}

    <div id="addParksModal" class="modal fade" role="dialog">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">Modal Header</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">&times;</button>
          </div>
          <div class="modal-body">
            <form action="/config/add" method="post" id="parkForm">
              <div class="form-group">
                <label>Park ID</label>
                <input type="text" id="parkid-add" name="add.parkid" value="" required>
              </div>
              <div class="form-group">
                <label for="ukey--add">UKey</label>
                <input type="text" id="ukey-add" name="add.ukey" value="" required>
              </div>
              <div class="form-group">
                <label for="station_id-add">station_id</label>
                <input type="text" id="station_id-add" name="add.station_id" value="" required>
              </div>
              <div class="form-group">
                <label for="deduction-time-add">Deduction Time</label>
                <input type="number" id="deduction-time-add" name="add.deduction_time" value="" required>
                <span class="unit">min</span>
              </div>
              <div class="form-group">
                <label for="deduction-money-add">Deduction Money</label>
                <input type="number" id="deduction-money-add" name="add.deduction_money" value="" required>
                <span class="unit">￥</span>
              </div>
              <div class="form-group">
                <label for="Duration-add">Duration</label>
                <input type="number" id="Duration-add" name="add.Duration" value="" required>
                <span class="unit">分钟</span>
              </div>
              <div class="form-group">
                <label for="remark-add">remark</label>
                <input type="text" id="remark-add" name="add.remark" value="" required>
              </div>
              <div class="form-group">
                <button type="submit" id="add_or_modify_btn">Add park</button>
                <input type="hidden" id="old_parkid" name="add.old_parkid" value="">
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
          </div>
        </div>
      </div>
    </div>

    <table id="table"></table>
  </div>

  <script>
    const $table = $('#table');
    const parkModal = document.getElementById('addParksModal');
    const modalInstance = parkModal ? new bootstrap.Modal(parkModal) : null;

    // Sanitize input to prevent XSS
    function sanitizeInput(input) {
      return $('<div>').text(input).html();
    }
  function showAlert(message) {
        $('#alertMessage').text(message).show();
        setTimeout(() => {
          $('#alertMessage').hide();
        }, 3000);
      }
    window.nameFormatter = (value, row, index) => {
      const safeValue = sanitizeInput(value);
      return `<a href="javascript:void(0)" class="edit" data-index="${index}" data-name="${safeValue}">${safeValue}</a>`;
    };

    window.operateFormatter = () => {
      return [
        '<a class="like" href="javascript:void(0)" title="Like">Edit</a>  ',
        '<a class="remove" href="javascript:void(0)" title="Remove">Remove</a>'
      ].join('');
    };

    window.operateEvents = {
      'click .like': (e, value, row) => {
        edit(row);
      },
      'click .remove': (e, value, row) => {
        if (!confirm(`确定要删除这个停车场吗？${row.parkid}`)) return;

        fetch(`/config/park/${row.parkid}`, {
          method: 'DELETE',
          headers: {
            //'X-CSRF-Token': document.querySelector('input[name="_csrf"]').value || ''
          }
        })
        .then(res => {
          if (!res.ok) throw new Error('网络响应异常');
          return res.json();
        })
        .then(data => {
          showAlert('删除成功'+data);
          $table.bootstrapTable('remove', {
            field: 'parkid',
            values: [row.parkid]
          });
        })
        .catch(err => {
          console.error('删除失败:', err);
          showAlert('删除失败'+err);
        });
      }
    };

    $('#table').bootstrapTable({
      url: '/config/parks',
      pagination: true,
      search: true,
      sortable: true,
      onError: (status) => {
        console.error('表格数据加载失败:', status);
        alert('无法加载数据，请检查网络连接');
      },
      onLoadSuccess: (data) => {
        showAlert('表格数据加载成功');
      },
      columns: [{
        field: 'parkid',
        title: 'parkid'
      }, {
        field: 'ukey',
        title: 'ukey'
      }, {
        field: 'deduction_time',
        title: 'deduction_time'
      }, {
        field: 'deduction_money',
        title: 'deduction_money'
      }, {
        field: 'station_id',
        title: 'station_id'
      }, {
        field: 'remark',
        title: 'remark'
      }, {
        field: 'Duration',
        title: 'Duration'
      }, {
        field: 'operate',
        title: 'operate',
        formatter: window.operateFormatter,
        events: window.operateEvents
      }]
    });

    function edit(row = {}) {
      const isEditMode = !!row.parkid;
      
      $('#parkid-add').val(sanitizeInput(row.parkid || ''));
      $('#old_parkid').val(sanitizeInput(row.parkid || ''));
      $('#ukey-add').val(sanitizeInput(row.ukey || ''));
      $('#deduction-time-add').val(row.deduction_time || '');
      $('#deduction-money-add').val(row.deduction_money || '');
      $('#remark-add').val(sanitizeInput(row.remark || ''));
      $('#Duration-add').val(row.Duration || '');
      $('#station_id-add').val(sanitizeInput(row.station_id || ''));

      const buttonText = isEditMode ? '修改停车场' : '添加停车场';
      $('#add_or_modify_btn').text(buttonText);
      $('#addParksModal .modal-title').text(buttonText);

      if (modalInstance) modalInstance.show();
    }

    document.addEventListener('DOMContentLoaded', function () {
      $('#addpark_Btn').click(function () {
        edit({});
      });
    });
  </script>
</body>

</html>
