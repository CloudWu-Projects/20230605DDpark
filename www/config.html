<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Config setting</title>
  <link rel="stylesheet"
    href="https://lf3-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap-icons/1.8.1/font/bootstrap-icons.css">
  <link href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/twitter-bootstrap/5.1.3/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="https://lf9-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap-table/1.19.1/bootstrap-table.min.css"
    rel="stylesheet">

  <script src="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/jquery/3.6.0/jquery.min.js"></script>
  <script
    src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
  <script
    src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/bootstrap-table/1.19.1/bootstrap-table.min.js"></script>


  <style>
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.5rem;
    }

    .form-group input {
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      border-radius: 0.25rem;
      border: 1px solid #ced4da;
      width: 80%;
      box-sizing: border-box;
    }

    .form-group .unit {
      margin-left: 0.5rem;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="alert alert-success" >{{.Version}}</div>
  <div class="container mt-3">
    <h3>逸安启 -20250601111 </h3>
    {{if .Debug }}
    <div class="alert alert-danger">Debug Mode</div>
    {{end}}

    <button type="button" class="btn btn-primary" data-bs-heading="添加停车场" id="addpark_Btn">
      添加停车场
    </button>
    {{template "modalForm" .}}

    <div id="addParksModal" class="modal fade" role="dialog">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">Modal Header</h4>
          </div>
          <div class="modal-body">
            <form action="/add" method="post">
              <div class="form-group">
                <label>Park ID</label>
                <input type="text" id="parkid-add" name="add.parkid" value="" required>
              </div>
              <div class="form-group">
                <label for="ukey--add">UKey</label>
                <input type="text" id="ukey-add" name="add.ukey" value="" required>
              </div>
              <div class="form-group">
                <label for="station_id-add">station_id</label>
                <input type="text" id="station_id-add" name="add.station_id" value="" required>
              </div>
              <div class="form-group">
                <label for="deduction-time-add">Deduction Time</label>
                <input type="number" id="deduction-time-add" name="add.deduction_time" value="" required>
                <span class="unit">min</span>
              </div>
              <div class="form-group">
                <label for="deduction-money-add">Deduction Money</label>
                <input type="number" id="deduction-money-add" name="add.deduction_money" value="" required>
                <span class="unit">￥</span>
              </div>


              <div class="form-group">
                <label for="Duration-add">Duration</label>
                <input type="number" id="Duration-add" name="add.Duration" value="" required>
                <span class="unit">分钟</span>
              </div>

              <div class="form-group">
                <label for="remark-add">remark</label>
                <input type="text" id="remark-add" name="add.remark" value="" required>
              </div>
              <div class="form-group">
                <button type="submit" id="add_or_modify_btn">Add park</button>
                <input type="hidden" id="old_parkid" name="add.old_parkid" value="">
              </div>
            </form>
          </div>
          <!-- 模态页脚 -->
          <!--<div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">关闭</button>
          </div>
        -->
        </div>
      </div>

    </div>
    


    <table id="table"></table>

  </div>
  <script>
    const $table = $('#table');
    window.nameFormatter = (value, row, index) => {
      return `<a href="javascript:void(0)" class="edit" data-index="${index}" data-name="${value}">${value}</a>`
    };
    window.operateFormatter = (value, row, index) => {
      b = [
        '<a class="like" href="javascript:void(0)" title="Like">',
        'Edit',
        '</a>  ',
        '<a class="remove" href="javascript:void(0)" title="Remove">',
        'Remove',
        '</a>'
      ].join('');

      return b;
    };

    window.operateEvents = {
      'click .like': (e, value, row) => {
        edit(row);
      },
      'click .remove': (e, value, row) => {

        fetch('/api/park/' + row.parkid, {
          method: 'DELETE',
        }).then(res => {
          return res.json();
        }).then(data => {
          console.log(data);
        }).catch(err => {
          console.log(err);
        });

        $table.bootstrapTable('remove', {
          field: 'parkid',
          values: [row.parkid]
        })
      }
    };
    $('#table').bootstrapTable({
      url: '/api/parks', // 数据源 URL
      pagination: true,
      search: true,
      sortable: true,
      columns: [{
        field: 'parkid',
        title: 'parkid'
      }, {
        field: 'ukey',
        title: 'ukey'
      }, {
        field: 'deduction_time',
        title: 'deduction_time'
      }, {
        field: 'deduction_money',
        title: 'deduction_money'
      },
      {
        field: 'station_id',
        title: 'station_id'
      },
      {
        field: 'remark',
        title: 'remark'
      },
      {
        field: 'Duration',
        title: 'Duration'
      },

      {
        field: 'operate',
        title: 'operate',
        formatter: operateFormatter,
        events: operateEvents
      }]
    });

    // 示例 edit 函数（具体实现根据实际需求）
    function edit(row) {
      //row.parkid, row.ukey, row.deduction_time, row.deduction_money,row.station_id
      $('#parkid-add').val(row.parkid);
      $('#old_parkid').val(row.parkid);
      $('#ukey-add').val(row.ukey);
      $('#deduction-time-add').val(row.deduction_time);
      $('#deduction-money-add').val(row.deduction_money);
      $('#remark-add').val(row.remark);
      $('#Duration-add').val(row.Duration);
      $('#station_id-add').val(row.station_id);


      $('#add_or_modify_btn').text((row.parkid == '') ? '添加停车场' : "修改停车场");
      // 显示 Modal
      $('#addParksModal .modal-title').text((row.parkid == '') ? '添加停车场' : "修改停车场");
      const myModal = new bootstrap.Modal(document.getElementById('addParksModal'));

      myModal.show();
    };
    document.addEventListener('DOMContentLoaded', function () {
      $('#addpark_Btn').click(function () {
        edit('', '', '', '', '');
      });
    });
    
  </script>
</body>

</html>
