<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Config setting</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/bootstrap-table.min.css">
</head>

<body>

  <div class="container mt-3">
    <h3>Modal 实例-20250606</h3>
    <p>请单击按钮打开模态。</p>

    <!-- <button type="button" class="btn btn-primary" data-bs-heading="添加停车场" data-bs-toggle="modal"
      data-bs-target="#addParksModal">
      添加停车场 by button
    </button>
    
    <button type="button" class="btn btn-primary" data-bs-heading="22222" data-bs-toggle="modal"
      data-bs-target="#addParksModal">
      打开模态2222
    </button>
     -->
    <button type="button" class="btn btn-primary" data-bs-heading="添加停车场" id="addpark_Btn">
      添加停车场
    </button>
    <button type="button" class="btn btn-primary" data-bs-heading="修改基础配置" data-bs-toggle="modal"
      data-bs-target="#modifybaseModal">
      修改基础配置
    </button>
    
    <div id="addParksModal" class="modal fade" role="dialog">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">Modal Header</h4>
          </div>
          <div class="modal-body">
            <form action="/add" method="post">
              <div>
                <label>Park ID</label>
                <input type="text" id="parkid-add" name="add.parkid" value="" required>
              </div>
              <div>
                <label for="ukey--add">UKey</label>
                <input type="text" id="ukey-add" name="add.ukey" value="" required>
              </div>
              </div>
              <div>
                <label for="station_id-add">station_id</label>
                <input type="text" id="station_id-add" name="add.station_id" value="" required>
              </div>
              <div>
                <label for="deduction-time-add">Deduction Time</label>
                <input type="number" id="deduction-time-add" name="add.deduction_time" value="" required>
                <span class="unit">min</span>
              </div>
              <div>
                <label for="deduction-money-add">Deduction Money</label>
                <input type="number" id="deduction-money-add" name="add.deduction_money" value="" required>
                <span class="unit">￥</span>
              </div>
              <div>
                <button type="submit" id="add_or_modify_btn">Add park</button>
                <input type="hidden" id="old_parkid" name="add.old_parkid" value="">
              </div>
            </form>
          </div>
          <!-- 模态页脚 -->
          <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">关闭</button>
          </div>
        </div>
      </div>

    </div>
    <div id="modifybaseModal" class="modal fade" role="dialog">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title">修改基础配置</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form action="/save" method="post">

              <div class="form-group">
                <label for="server.port">Server Port</label>
                <input type="text" id="server.port" name="server.port" value="{{.Server.Port}}" required>
              </div>
              <div class="form-group">
                <label for="api.TingCheYunUrl">API Base URL</label>
                <input type="text" id="api.TingCheYunUrl" name="api.TingCheYunUrl" value="{{.API.TingCheYunUrl}}" required>
              </div>
              
              <div class="form-group">
                <label for="YiAnqi.SignKey">YiAnqi.SignKey</label>
                <input type="text" id="YiAnqi.SignKey" name="YiAnqi.SignKey" value="{{.YiAnqi.SignKey}}" required>
              </div>

              <div class="form-group">
                <label for="YiAnqi.AesKey">YiAnqi.AES key</label>
                <input type="text" id="YiAnqi.AesKey" name="YiAnqi.AesKey" value="{{.YiAnqi.AesKey}}" required>
              </div>
              
              <div class="form-group">
                <label for="YiAnqi.AesIv">YiAnqi.aes.IV</label>
                <input type="text" id="YiAnqi.AesIv" name="YiAnqi.AesIv" value="{{.YiAnqi.AesIv}}" required>
              </div>
              
              <div><button type="submit">Save</button></div>
            </form>
          </div>
          <!-- 模态页脚 -->
          <!-- <div class="modal-footer">
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">关闭</button>
          </div> -->
        </div>
      </div>
    </div>


    <table id="table"></table>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.24.1/dist/bootstrap-table.min.js"></script>

  <script>
    const $table = $('#table');
    window.nameFormatter = (value, row, index) => {
      return `<a href="javascript:void(0)" class="edit" data-index="${index}" data-name="${value}">${value}</a>`
    };
    window.operateFormatter = (value, row, index) => {
      b = [
        '<a class="like" href="javascript:void(0)" title="Like">',
        'Edit',
        '</a>  ',
        '<a class="remove" href="javascript:void(0)" title="Remove">',
        'Remove',
        '</a>'
      ].join('');

      return b;
    };

    window.operateEvents = {
      'click .like': (e, value, row) => {
        edit(row.parkid, row.ukey, row.deduction_time, row.deduction_money,row.station_id);
      },
      'click .remove': (e, value, row) => {

        fetch('/api/deletepark/' + row.parkid, {
          method: 'POST',
        }).then(res => {
          return res.json();
        }).then(data => {
          console.log(data);
        }).catch(err => {
          console.log(err);
        });

        $table.bootstrapTable('remove', {
          field: 'parkid',
          values: [row.parkid]
        })
      }
    };
    $('#table').bootstrapTable({
      url: '/api/parks', // 数据源 URL
      pagination: true,
      search: true,
      sortable: true,
      columns: [{
        field: 'parkid',
        title: 'parkid'
      }, {
        field: 'ukey',
        title: 'ukey'
      }, {
        field: 'deduction_time',
        title: 'deduction_time'
      }, {
        field: 'deduction_money',
        title: 'deduction_money'
      },
      {
        field: 'station_id',
        title: 'station_id'
      },

      {
        field: 'operate',
        title: 'operate',
        formatter: operateFormatter,
        events: operateEvents
      }]
    });

    // 示例 edit 函数（具体实现根据实际需求）
    function edit(parkid, ukey, deductionTime, deductionMoney,station_id) {
      $('#parkid-add').val(parkid);
      $('#old_parkid').val(parkid);
      $('#ukey-add').val(ukey);
      $('#deduction-time-add').val(deductionTime);
      $('#deduction-money-add').val(deductionMoney);
      $('#station_id-add').val(station_id);
      $('#add_or_modify_btn').text((parkid == '') ? '添加停车场' : "修改停车场");
      // 显示 Modal
      $('#addParksModal .modal-title').text((parkid == '') ? '添加停车场' : "修改停车场");
      const myModal = new bootstrap.Modal(document.getElementById('addParksModal'));

      myModal.show();
    };
    document.addEventListener('DOMContentLoaded', function () {
      $('#addpark_Btn').click(function () {
        edit('', '', '', '','');
      });
    });


  </script>
</body>

</html>
